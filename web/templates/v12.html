{% extends "base.html" %}
{% block title %}V12.31 五池看板{% endblock %}

{% block content %}
<div x-data="poolsApp()" x-init="init()" class="space-y-6">

  <!-- Header: 日期 + 生成 + 单股 -->
  <div class="card p-5 flex flex-wrap items-center gap-4 justify-between">
    <div>
      <div class="text-lg font-semibold">V12.31 五池看板</div>
      <div class="text-xs text-text-muted mt-1">
        池A 系统推荐(抄底回调) · 池B 自选 · 池C 基金重仓(机构抱团) · 池D 追高动量(对照) — ratio = pump↑ / (pump↓+ε)
      </div>
    </div>
    <div class="flex items-center gap-3">
      <label class="text-sm text-text-muted">日期</label>
      <select x-model="date" @change="loadPools()" class="text-sm">
        <template x-for="d in dates" :key="d">
          <option :value="d" x-text="formatDate(d)"></option>
        </template>
      </select>
      <button class="btn btn-ghost" @click="runUpdate()" :disabled="busy.update || busy.market" title="拉取最新交易日数据 + 重算特征 + 重跑五池">
        <span x-show="!busy.update">🔄 更新数据</span>
        <span x-show="busy.update" class="text-text-muted">更新中...</span>
        <span class="text-text-dim text-xs">5 pt</span>
      </button>
      <button class="btn btn-primary" @click="runMarket()" :disabled="busy.market || busy.update">
        <span x-show="!busy.market">🧮 跑全市场生成五池</span>
        <span x-show="busy.market" class="text-text-muted">推理中...</span>
        <span class="text-text-dim text-xs">5 pt</span>
      </button>
    </div>
  </div>

  <!-- 进度面板 -->
  <template x-if="activeProgress.show">
    <div class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <div class="font-medium" x-text="activeProgress.title"></div>
        <div class="text-xs text-text-muted">
          <span x-text="activeProgress.phase"></span><span class="mx-2">·</span>
          <span x-text="activeProgress.percent + '%'"></span>
          <span x-show="activeProgress.elapsed" class="mx-2">·</span>
          <span x-show="activeProgress.elapsed" x-text="activeProgress.elapsed + 's'"></span>
        </div>
      </div>
      <div class="progress mb-3"><div :style="`width: ${activeProgress.percent}%`"></div></div>
      <div class="text-sm text-text" x-text="activeProgress.message"></div>
      <div class="mt-4 max-h-56 overflow-y-auto border border-line rounded p-3 bg-bg space-y-1">
        <template x-for="(ev, i) in activeProgress.events" :key="i">
          <div class="text-xs flex gap-2 items-start">
            <span class="text-text-dim shrink-0 w-16" x-text="ev.ts"></span>
            <span class="text-accent shrink-0 w-24" x-text="ev.phase"></span>
            <span class="text-text-muted shrink-0 w-10 text-right" x-text="ev.percent + '%'"></span>
            <span class="text-text" x-text="ev.message"></span>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- 五池 Tab -->
  <template x-if="pools">
    <div class="card overflow-hidden">
      <!-- 大盘指数基准 -->
      <template x-if="benchmark && benchmark.length">
        <div class="px-5 py-2 bg-bg border-b border-line flex flex-wrap items-center gap-x-6 gap-y-1 text-xs">
          <span class="text-text-dim font-medium">📊 大盘基准</span>
          <template x-for="idx in benchmark" :key="idx.ts_code">
            <span class="inline-flex items-center gap-1">
              <span class="text-text-muted" x-text="idx.name"></span>
              <span class="font-mono" :class="idx.past_r5 > 0 ? 'text-success' : idx.past_r5 < 0 ? 'text-danger' : 'text-text-dim'"
                x-text="idx.past_r5 !== null ? (idx.past_r5 > 0 ? '+' : '') + idx.past_r5.toFixed(1) + '%' : '-'"></span>
            </span>
          </template>
        </div>
      </template>
      <!-- tab 头 -->
      <div class="flex border-b border-line">
        <template x-for="k in ['A','B','C','D','E']" :key="k">
          <button @click="tab=k"
            class="px-5 py-3 text-sm font-medium border-b-2 transition"
            :class="tab===k ? 'border-accent text-accent' : 'border-transparent text-text-muted hover:text-text'">
            <span x-text="'池'+k+' '+pools[k].name"></span>
            <span class="ml-1 text-xs text-text-dim" x-text="'('+pools[k].count+')'"></span>
          </button>
        </template>
      </div>
      <!-- tab 内容 -->
      <template x-for="k in ['A','B','C','D','E']" :key="k">
        <div x-show="tab===k">
          <div class="px-5 py-3 bg-bg flex flex-wrap items-center gap-x-4 gap-y-1 text-xs">
            <span class="badge" :class="poolBadge(k)" x-text="pools[k].dna"></span>
            <span class="text-text-muted" x-text="pools[k].desc"></span>
            <span class="text-text-dim" x-text="pools[k].count+'股 · 入主推★ '+pools[k].n_star"></span>
            <span class="ml-auto flex items-center gap-2">
              <template x-if="k==='B'">
                <span class="flex items-center gap-2">
                  <span x-show="watchMsg" class="text-xs" :class="watchMsg.startsWith('✗')?'text-danger':'text-success'" x-text="watchMsg"></span>
                  <input x-model="watchInput" @keydown.enter="addWatchB()" placeholder="加自选 如 600519" class="text-xs w-36 font-mono py-1">
                  <button class="btn btn-ghost text-xs py-1" @click="addWatchB()" :disabled="busy.watch">＋ 加自选</button>
                  <a href="/analyze" class="btn btn-primary text-xs py-1">新建分析</a>
                </span>
              </template>
              <template x-if="k!=='B' && k!=='E'">
                <span class="badge badge-accent">⚙ 系统自动生成</span>
              </template>
              <template x-if="k==='E'">
                <span class="badge badge-info">🔗 外部策略每日调用</span>
              </template>
            </span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="text-xs text-text-muted bg-bg">
                <tr>
                  <th class="px-3 py-2 text-left">#</th>
                  <th class="px-3 py-2 text-left">代码</th>
                  <th class="px-3 py-2 text-left">名称</th>
                  <th class="px-3 py-2 text-left">行业</th>
                  <th class="px-3 py-2 text-right" x-show="k==='C'">持有基金</th>
                  <th class="px-3 py-2 text-right cursor-pointer select-none hover:text-accent" @click="setSort('r20')"
                      :class="sortKey==='r20'?'text-accent':''">r20<span x-text="sortArrow('r20')"></span></th>
                  <th class="px-3 py-2 text-right">pump↑</th>
                  <th class="px-3 py-2 text-right">pump↓</th>
                  <th class="px-3 py-2 text-right cursor-pointer select-none hover:text-accent" @click="setSort('ratio')"
                      :class="sortKey==='ratio'?'text-accent':''">ratio<span x-text="sortArrow('ratio')"></span></th>
                  <th class="px-3 py-2 text-right cursor-pointer select-none hover:text-accent" @click="setSort('past5')"
                      :class="sortKey==='past5'?'text-accent':''">past5<span x-text="sortArrow('past5')"></span></th>
                  <th class="px-3 py-2 text-center">主推</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(r,i) in sortedItems(k)" :key="r.ts_code">
                  <tr class="border-t border-line hover:bg-bg-hover">
                    <td class="px-3 py-2 text-text-dim" x-text="i+1"></td>
                    <td class="px-3 py-2 font-mono whitespace-nowrap">
                      <a :href="`/stock/${r.ts_code}/history`" class="hover:text-accent" x-text="r.ts_code"></a>
                      <button x-show="k==='B'" @click="removeWatchB(r.ts_code)" class="ml-2 text-text-dim hover:text-danger" title="移出自选">✕</button>
                    </td>
                    <td class="px-3 py-2" x-text="r.name || '—'"></td>
                    <td class="px-3 py-2 text-text-muted" x-text="r.industry || '—'"></td>
                    <td class="px-3 py-2 text-right" x-show="k==='C'"
                        :class="(r.n_funds||0)>=10 ? 'text-accent font-medium' : 'text-text-muted'"
                        x-text="r.n_funds!=null ? r.n_funds : '—'"></td>
                    <td class="px-3 py-2 text-right whitespace-nowrap">
                      <span x-text="r.r20!=null ? r.r20.toFixed(0) : '—'"></span>
                      <span x-show="r.r20_dir==='up'" class="up">↑</span><span x-show="r.r20_dir==='down'" class="down">↓</span>
                    </td>
                    <td class="px-3 py-2 text-right text-text-muted" x-text="r.pump_up!=null ? r.pump_up.toFixed(3) : '—'"></td>
                    <td class="px-3 py-2 text-right text-text-muted" x-text="r.pump_down!=null ? r.pump_down.toFixed(3) : '—'"></td>
                    <td class="px-3 py-2 text-right font-medium whitespace-nowrap">
                      <span :class="r.ratio>=5 ? 'text-warn' : (r.ratio>=2 ? 'text-success' : 'text-text')"
                            x-text="r.ratio!=null ? r.ratio.toFixed(1)+'x' : '—'"></span>
                      <span x-show="r.ratio_dir==='up'" class="up">↑</span><span x-show="r.ratio_dir==='down'" class="down">↓</span>
                    </td>
                    <td class="px-3 py-2 text-right"
                        :class="(r.past5||0)>0 ? 'up' : 'down'"
                        x-text="r.past5!=null ? ((r.past5*100>=0?'+':'')+(r.past5*100).toFixed(1)+'%') : '—'"></td>
                    <td class="px-3 py-2 text-center">
                      <span x-show="r.v7c" class="badge badge-success">★</span>
                      <span x-show="!r.v7c" class="text-text-dim">—</span>
                    </td>
                  </tr>
                </template>
                <template x-if="pools[k].items.length===0">
                  <tr><td colspan="11" class="px-3 py-8 text-center text-text-muted text-sm">该池无数据</td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>
      <div class="px-5 py-3 text-xs text-text-dim border-t border-line">
        提示: 池A=系统抄底回调; 池C≈池D=机构/市场追高动量, 两套逻辑对立, 谁对取决当下 regime。ratio 是强度确认非买入信号。
      </div>
    </div>
  </template>

  <template x-if="pools===null && !busy.market">
    <div class="card p-8 text-center text-text-muted">
      <div class="text-sm">该日期无五池数据</div>
      <div class="text-xs mt-2">点击上方"跑全市场生成五池"按钮启动 (约 1-2 分钟)</div>
    </div>
  </template>

  <!-- 单股实时评分 -->
  <div class="card p-5">
    <div class="font-medium mb-3">单股 V12.31 实时评分</div>
    <div class="flex gap-2 items-center">
      <input x-model="symbolQuery" placeholder="如: 600779.SH" class="text-sm w-48 font-mono">
      <button class="btn btn-ghost" @click="scoreOne()">查询</button>
      <span x-show="busy.score" class="text-xs text-text-muted">查询中(~5s)...</span>
    </div>
    <template x-if="singleResult">
      <div class="mt-4 grid grid-cols-4 gap-3 text-sm">
        <div><div class="text-xs text-text-muted">ratio</div><div class="font-medium text-warn" x-text="sr_ratio()"></div></div>
        <div><div class="text-xs text-text-muted">pump↑</div><div x-text="num(singleResult.pump_score)"></div></div>
        <div><div class="text-xs text-text-muted">pump↓</div><div x-text="num(singleResult.pump_down_score)"></div></div>
        <div><div class="text-xs text-text-muted">r20 分</div><div x-text="num(singleResult.buy_r20_score,0)"></div></div>
        <div><div class="text-xs text-text-muted">V7c 主推</div><div x-text="singleResult.v7c_recommend ? '✓ 入池' : '× 未入'"></div></div>
        <div><div class="text-xs text-text-muted">past_r5</div><div x-text="singleResult.past_r5!=null ? (singleResult.past_r5*100).toFixed(1)+'%' : '—'"></div></div>
        <div><div class="text-xs text-text-muted">pyr_velocity</div><div x-text="num(singleResult.pyr_velocity_20_60,4)"></div></div>
        <div><div class="text-xs text-text-muted">行业</div><div x-text="singleResult.industry || '—'"></div></div>
      </div>
    </template>
  </div>
</div>

<script>
function poolsApp() {
  return {
    date: '', dates: [], pools: null, benchmark: [], tab: 'A',
    sortKey: '', sortDir: 'desc',
    busy: { market: false, score: false, watch: false, update: false },
    symbolQuery: '', singleResult: null,
    watchInput: '', watchMsg: '',
    activeProgress: { show:false, title:'', phase:'', percent:0, message:'', elapsed:0, events:[], _startTs:null, _es:null },

    async init() {
      const t = new URLSearchParams(location.search).get('tab');
      if (['A','B','C','D','E'].includes(t)) this.tab = t;
      await this.loadDates();
      if (this.dates.length) { this.date = this.dates[this.dates.length-1]; await this.loadPools(); }
    },
    async loadDates() {
      const r = await api('/api/v12/pool-dates'); if (!r) return;
      const j = await r.json(); this.dates = j.dates || [];
      // 若无五池日期, 退回 v12 dates (可生成)
      if (!this.dates.length) { const r2 = await api('/api/v12/dates'); if (r2) { const j2 = await r2.json(); this.dates = j2.dates || []; } }
    },
    async loadPools() {
      if (!this.date) return;
      this.pools = null;
      const r = await fetch(`/api/v12/pools?date=${this.date}`, {credentials:'include'});
      if (r.status === 404) { this.pools = null; return; }
      const j = await r.json(); this.pools = j.pools; this.benchmark = j.benchmark || [];
    },
    formatDate(d){ return `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`; },
    poolBadge(k){ return ({A:'badge-success',B:'badge-accent',C:'badge-warn',D:'badge-danger',E:'badge-info'})[k]||'badge-accent'; },
    setSort(key){ if(this.sortKey===key){ this.sortDir = this.sortDir==='desc'?'asc':'desc'; } else { this.sortKey=key; this.sortDir='desc'; } },
    sortArrow(key){ if(this.sortKey!==key) return ' ⇅'; return this.sortDir==='desc'?' ↓':' ↑'; },
    sortedItems(k){
      const items = (this.pools && this.pools[k]) ? this.pools[k].items : [];
      if(!this.sortKey) return items;
      const key=this.sortKey, asc=this.sortDir==='asc';
      return [...items].sort((a,b)=>{
        let x=a[key], y=b[key];
        if(x==null) return 1; if(y==null) return -1;   // null 永远排末尾
        return asc ? x-y : y-x;
      });
    },
    // ── 池B 自选管理 (持久化 REST + 即时打分注入) ──
    async addWatchB(){
      const code = (this.watchInput||'').trim().toUpperCase(); if(!code) return;
      this.busy.watch = true; this.watchMsg = '';
      try {
        const r = await api(`/api/v12/watchlist-b?code=${encodeURIComponent(code)}`, {method:'POST'});
        if(!r) return;
        if(!r.ok){ this.watchMsg = '✗ ' + (await r.text()).slice(0,60); return; }
        const norm = (await r.json()).added || code;
        this.watchInput = '';
        const ok = await this.injectScored(norm);
        this.watchMsg = ok ? `✓ ${norm} 已加入并打分` : `✓ ${norm} 已加入 (该日无数据,下次生成入池)`;
        this.tab = 'B';
        setTimeout(()=>{ this.watchMsg=''; }, 5000);
      } finally { this.busy.watch = false; }
    },
    async injectScored(code){
      try {
        const r = await fetch(`/api/v12/pool-item?date=${this.date}&code=${encodeURIComponent(code)}`, {credentials:'include'});
        if(!r.ok) return false;
        const item = await r.json();
        if(this.pools && this.pools.B && !this.pools.B.items.some(x=>x.ts_code===item.ts_code)){
          this.pools.B.items.push(item); this.pools.B.count = this.pools.B.items.length;
        }
        return true;
      } catch { return false; }
    },
    async removeWatchB(code){
      if(!confirm(`移出自选 ${code}?`)) return;
      const r = await api(`/api/v12/watchlist-b/${code}`, {method:'DELETE'});
      if(!r || !r.ok) return;
      if(this.pools && this.pools.B){
        this.pools.B.items = this.pools.B.items.filter(x=>x.ts_code!==code);
        this.pools.B.count = this.pools.B.items.length;
      }
    },
    num(v,n=3){ return (v!=null && !isNaN(v)) ? Number(v).toFixed(n) : '—'; },
    sr_ratio(){ const s=this.singleResult; if(!s||s.pump_score==null) return '—';
      return (s.pump_score/((s.pump_down_score||0)+0.01)).toFixed(1)+'x'; },

    _attachSse(resultId, title, onDone) {
      const ap = this.activeProgress;
      ap.show=true; ap.title=title; ap.phase='connecting'; ap.percent=0;
      ap.message='建立 SSE 连接...'; ap.events=[]; ap._startTs=Date.now(); ap.elapsed=0;
      const tick = setInterval(()=>{ if(!ap.show){clearInterval(tick);return;} ap.elapsed=Math.floor((Date.now()-ap._startTs)/1000); },1000);
      const es = new EventSource(`/api/results/${resultId}/stream`, {withCredentials:true});
      ap._es = es;
      const hp = (data)=>{ ap.phase=data.phase||''; ap.percent=data.percent||0; ap.message=data.message||'';
        ap.events.push({ts:(data.ts||'').slice(11,19),phase:data.phase||'',percent:data.percent||0,message:data.message||''});
        this.$nextTick(()=>{const log=document.querySelector('.max-h-56.overflow-y-auto'); if(log)log.scrollTop=log.scrollHeight;}); };
      es.addEventListener('progress', e=>{try{hp(JSON.parse(e.data));}catch{}});
      es.addEventListener('done', e=>{ ap.message=`✓ 完成 (${ap.elapsed}s)`; ap.percent=100; es.close(); clearInterval(tick); if(onDone)onDone(); });
      es.addEventListener('failed', e=>{ try{const d=JSON.parse(e.data); ap.message=`✗ 失败: ${d.error||'未知'} (退款 ${d.refunded||0} pt)`;}catch{} es.close(); clearInterval(tick); if(onDone)onDone(); });
      es.onerror = ()=>{};
    },
    async runMarket() {
      if (this.busy.market) return;
      this.busy.market = true;
      try {
        const r = await api('/api/v12/jobs/market', {method:'POST', body:JSON.stringify({date:this.date})});
        if (!r.ok) { alert('启动失败: ' + (await r.text()).slice(0,200)); this.busy.market=false; return; }
        const j = await r.json();
        this._attachSse(j.result_id, `V12 全市场生成五池 (${this.formatDate(this.date)})`,
          async ()=>{ this.busy.market=false; await this.loadDates(); await this.loadPools(); });
      } catch(e){ alert('错误: '+e.message); this.busy.market=false; }
    },
    async runUpdate() {
      this.busy.update = true;
      try {
        // date 缺省 → 后端自动检测最新交易日, 拉数据 + 重算特征 + 重跑五池
        const r = await api('/api/v12/jobs/update', {method:'POST', body:JSON.stringify({})});
        if (!r.ok) { alert('启动失败: ' + (await r.text()).slice(0,200)); this.busy.update=false; return; }
        const j = await r.json();
        this._attachSse(j.result_id, '🔄 更新数据 + 重跑五池 (最新交易日)',
          async ()=>{
            this.busy.update=false;
            await this.loadDates();
            if (this.dates.length) { this.date = this.dates[this.dates.length-1]; }
            await this.loadPools();
          });
      } catch(e){ alert('错误: '+e.message); this.busy.update=false; }
    },
    async scoreOne() {
      const sym = this.symbolQuery.trim().toUpperCase(); if(!sym) return;
      this.busy.score=true; this.singleResult=null;
      try {
        const r = await fetch(`/api/v12/score/${sym}?date=${this.date}`, {credentials:'include'});
        if (!r.ok) { alert(`查询失败: ${(await r.text()).slice(0,200)}`); return; }
        this.singleResult = await r.json();
      } finally { this.busy.score=false; }
    },
  };
}
</script>
{% endblock %}
